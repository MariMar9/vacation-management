articles:
  - number: FE-02-07-13
    title: Frontend framework, identity flow, and quality
    criticality: HIGH
    status: refined
    decision: modified
    content: Existing frontend constitution is an unratified template; wizard prefill selects Angular.
    modified_content: |
      Frontend decisions for the Vacation Management test project:
      - Framework: Angular 20, as a single-page application.
      - Authentication direction: Microsoft Entra ID using OIDC; the frontend uses the browser-appropriate authorization flow. Detailed population, roles, permissions, and feature access rules remain open under F-006.
      - No mobile application is in this test-project scope.
      - Frontend checks: Angular lint and test commands where project manifests exist; at least one executable Playwright smoke test must pass using npx playwright test --grep @smoke.
      - Global quality gates: lint errors 0, test pass rate 100%, line coverage >= 80%, branch coverage >= 75%, and mutation score >= 70% where tooling applies.
      The interface framework decision does not approve feature requirements, screen behavior, or user journeys.
    reason: Angular is the existing wizard choice and user-authorized test stack; identity protocol direction does not decide feature authorization policy.
